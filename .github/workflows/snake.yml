name: generate contribution snake

on:
  # regenerate once a day
  schedule:
    - cron: "0 0 * * *"
  # allow a manual run from the Actions tab or gh workflow run
  workflow_dispatch:
  # regenerate on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate pixel-snake.svg from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pixel-snake.svg
            dist/pixel-snake-dark.svg?palette=github-dark

      - name: push the svg files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
